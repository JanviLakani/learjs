<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .color {
            color: rgb(204, 23, 23);
        }
    </style>
</head>
<body>

   <form action="" onsubmit="handlesubmit()">

    <h2>Processor System</h2>
    Processor :
    <input type="radio" id="i3" value="10000" name="processor">
    <label for="">i3</label>
    <input type="radio" id="i5" value="15000" name="processor">
    <label for="">i5</label>
    <input type="radio" id="i7" value="20000" name="processor">
    <label for="">i7</label>

    <span id="pcerror" class="color"></span>


    <br>
    RAM :
    <input type="radio" id="4GB" value="500" name="ram">
    <label for="">4GB</label>
    <input type="radio" id="8GB" value="1000" name="ram">
    <label for="">8GB</label>
    <input type="radio" id="12GB" value="2000" name="ram">
    <label for="">12GB</label>
    <span id="ramerror"></span>

    <span id="ramerror" class="color"></span>


    <br>
    Momory : 
    <input type="radio" id="256GB" value="2500" name="memory">
    <label for="">256GB</label>
    <input type="radio" id="512GB" value="5000" name="memory">
    <label for="">512GB</label>
    <input type="radio" id="1TB" value="10000" name="memory">
    <label for="">1TB</label>

    <span id="memoryerror" class="color"></span>


    <br>
    Graphics Cardd : 
    <input type="radio" id="Yes" value="8000" name="graphicscard">
    <label for="">Yes</label>
    <input type="radio" id="No" value="0" name="graphicscard">
    <label for="">No</label>

    <span id="graphicscarderror" class="color"></span>


    <br><br>
    <input type="submit">

    <div id="money"></div>
    
   </form>
    

    <script src="js/2pc_selection_withcondition_system.js"></script>
</body>
</html>
